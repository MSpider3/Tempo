name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    # Tempo needs libadwaita 1.6 or newer; Fedora ships current GNOME libraries.
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc clang-devel pkgconf-pkg-config rust cargo clippy \
            gtk4-devel libadwaita-devel glib2-devel pipewire-devel \
            ffmpeg-free ffmpeg-free-devel

      # Fedora's FFmpeg encodes H.264 with Cisco's OpenH264, from a separate repository
      # (codecs.fedoraproject.org). When that repository doesn't answer, dnf quietly
      # installs "noopenh264", a stand-in that can't encode, and making the test clips
      # fails. Swap in the real one, retrying, and stop with a clear message if we can't.
      - name: Make sure the real OpenH264 is installed
        run: |
          for attempt in 1 2 3 4 5; do
            if rpm -q noopenh264 >/dev/null 2>&1; then
              dnf swap -y --refresh noopenh264 openh264 || true
            fi
            if ffmpeg -v error -f lavfi -i testsrc2=size=64x64:duration=0.1 -c:v libopenh264 -f null -; then
              echo "OpenH264 works ($(rpm -q openh264))"
              exit 0
            fi
            echo "OpenH264 can't encode yet (attempt $attempt); waiting for Cisco's repository"
            sleep 30
          done
          echo "::error::Could not install Cisco's OpenH264 (codecs.fedoraproject.org did not answer). This is a download problem, not a Tempo problem: re-run the job later."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fedora44-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: fedora44-cargo-

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Make the sample clips the media tests read
        run: bash scripts/make_test_media.sh

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
