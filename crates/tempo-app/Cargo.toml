[package]
name = "tempo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "tempo"
path = "src/main.rs"

# The editor itself needs only the interface crate. Keeping the list short keeps
# the binary small and start-up fast.
[lints]
workspace = true

[dependencies]
tempo-ui = { path = "../tempo-ui" }
glib = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Used only by the programs in examples/.
[dev-dependencies]
tempo-export = { path = "../tempo-export" }
tempo-timeline = { path = "../tempo-timeline" }
tempo-media = { path = "../tempo-media" }
tempo-project = { path = "../tempo-project" }

# ---- Packaging (see .github/workflows/release.yml) ---------------------------

[package.metadata.deb]
name = "tempo"
maintainer = "MSpider3 <golechamehul03@gmail.com>"
section = "video"
priority = "optional"
extended-description = "A light video editor for Linux that works like DaVinci Resolve's Edit page."
# FFmpeg's program is used for export and proxies.
depends = "$auto, ffmpeg"
assets = [
    ["target/release/tempo", "usr/bin/tempo", "755"],
    ["../../packaging/dev.tempo.Tempo.desktop", "usr/share/applications/dev.tempo.Tempo.desktop", "644"],
    ["../../packaging/dev.tempo.Tempo.metainfo.xml", "usr/share/metainfo/dev.tempo.Tempo.metainfo.xml", "644"],
    ["../../assets/icons/dev.tempo.Tempo.svg", "usr/share/icons/hicolor/scalable/apps/dev.tempo.Tempo.svg", "644"],
    ["../../assets/icons/dev.tempo.Tempo-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/dev.tempo.Tempo-symbolic.svg", "644"],
]

[package.metadata.generate-rpm]
name = "tempo"
summary = "A light video editor that works like DaVinci Resolve's Edit page"
assets = [
    { source = "target/release/tempo", dest = "/usr/bin/tempo", mode = "755" },
    { source = "../../packaging/dev.tempo.Tempo.desktop", dest = "/usr/share/applications/dev.tempo.Tempo.desktop", mode = "644" },
    { source = "../../packaging/dev.tempo.Tempo.metainfo.xml", dest = "/usr/share/metainfo/dev.tempo.Tempo.metainfo.xml", mode = "644" },
    { source = "../../assets/icons/dev.tempo.Tempo.svg", dest = "/usr/share/icons/hicolor/scalable/apps/dev.tempo.Tempo.svg", mode = "644" },
    { source = "../../assets/icons/dev.tempo.Tempo-symbolic.svg", dest = "/usr/share/icons/hicolor/symbolic/apps/dev.tempo.Tempo-symbolic.svg", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"/usr/bin/ffmpeg" = "*"
