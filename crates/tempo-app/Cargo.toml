[package]
name = "tempo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "tempo"
path = "src/main.rs"

# The editor itself needs only the interface crate. Keeping the list short keeps
# the binary small and start-up fast.
[dependencies]
tempo-ui = { path = "../tempo-ui" }
glib = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Used only by examples/make_demo_project.rs.
[dev-dependencies]
tempo-timeline = { path = "../tempo-timeline" }
tempo-media = { path = "../tempo-media" }
tempo-project = { path = "../tempo-project" }
