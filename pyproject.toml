[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tempo"
version = "0.1.0"
description = "Lightweight CPU-only video editor inspired by DaVinci Resolve's Cut Page"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "MSpider3" },
]
keywords = ["video-editor", "video", "editing", "ffmpeg", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Typing :: Typed",
]

dependencies = [
    "PySide6>=6.7.0",
    "ffmpeg-python>=0.2.0",
    "python-mpv>=1.0.7",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
tempo = "tempo.__main__:main"

[project.urls]
Homepage = "https://github.com/MSpider3/Tempo"
Repository = "https://github.com/MSpider3/Tempo"
Issues = "https://github.com/MSpider3/Tempo/issues"

# ---------------------------------------------------------------------------
# Development dependencies (installed via `uv sync --dev`)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-qt>=4.4.0",
]

# ---------------------------------------------------------------------------
# Tool Configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["tempo"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "mpv.*",
    "ffmpeg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
