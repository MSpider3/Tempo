# Flatpak manifest for Tempo.
#
#   flatpak-builder --user --install --force-clean build-dir packaging/dev.tempo.Tempo.yml
#
# Built and checked by the release workflow. Cargo downloads its crates during
# the build, which needs network access (allowed below). Flathub does not allow
# that; a Flathub submission needs the crates listed as sources instead
# (flatpak-cargo-generator makes that list from Cargo.lock).
#
# FFmpeg (libraries and program) comes from the runtime and its codecs-extra
# extension, which Flatpak installs automatically.
app-id: dev.tempo.Tempo
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: tempo

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Sound through PipeWire.
  - --filesystem=xdg-run/pipewire-0
  # Media can live anywhere; projects and exports go to Videos by default.
  - --filesystem=host

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/tempo/cargo

modules:
  - name: tempo
    buildsystem: simple
    build-commands:
      - cargo build --release --locked -p tempo-app
      - install -Dm755 target/release/tempo /app/bin/tempo
      - install -Dm644 packaging/dev.tempo.Tempo.desktop /app/share/applications/dev.tempo.Tempo.desktop
      - install -Dm644 packaging/dev.tempo.Tempo.metainfo.xml /app/share/metainfo/dev.tempo.Tempo.metainfo.xml
      - install -Dm644 assets/icons/dev.tempo.Tempo.svg /app/share/icons/hicolor/scalable/apps/dev.tempo.Tempo.svg
      - install -Dm644 assets/icons/dev.tempo.Tempo-symbolic.svg /app/share/icons/hicolor/symbolic/apps/dev.tempo.Tempo-symbolic.svg
    sources:
      - type: dir
        path: ..
